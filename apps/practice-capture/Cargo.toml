[package]
name = "practice-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A visible, user-controlled screenshot helper for macOS practice sessions"
license = "MIT"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "=0.8.0"
xcap = "=0.9.8"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[profile.release]
strip = true
lto = "thin"

